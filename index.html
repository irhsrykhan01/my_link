<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Links</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#000,#020617,#0f172a);
  color:#fff;
  overflow:hidden;
}

/* CONTAINER (NORMAL SIZE) */
.container{
  width:100%;
  max-width:300px;
  padding:14px;
  text-align:center;
}

.profile img{
  width:75px;height:75px;border-radius:50%;
  border:2px solid rgba(255,255,255,0.6);
  object-fit:cover;margin-bottom:8px;
}

.profile h1{font-size:18px;font-weight:700}
.profile p{font-size:12px;opacity:0.7}

.links{margin-top:18px}

/* TOMBOL SATU WARNA */
.links a{
  display:block;
  text-decoration:none;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  color:#fff;
  background:#1e293b;
  transition:0.2s;
}

.links a:hover{
  background:#334155;
  transform:scale(1.03);
}

.footer{margin-top:14px;font-size:10px;opacity:0.6}

/* PARTICLES CEPAT RANDOM */
.particle{
  position:absolute;
  background:white;
  border-radius:50%;
  opacity:0.4;
  animation:move linear infinite;
}

@keyframes move{
  from{transform:translateY(100vh)}
  to{transform:translateY(-10vh)}
}

</style></head>
<body><!-- PARTICLES AUTO --><script>
for(let i=0;i<50;i++){
  let p=document.createElement('div');
  p.className='particle';

  let size=Math.random()*6+2;
  p.style.width=size+'px';
  p.style.height=size+'px';

  p.style.left=Math.random()*100+'vw';

  let duration=Math.random()*2+1.5;
  p.style.animationDuration=duration+'s';

  p.style.opacity=Math.random();

  document.body.appendChild(p);
}
</script><div class="container"><div class="profile">
<img src="avatar.jpg">
<h1>CHANNEL LINK 🔗</h1>
<p>Creator • Sticker</p>
</div><div class="links">

</div><div class="footer">Thanks for visiting 👀</div></div></body>
</html>
